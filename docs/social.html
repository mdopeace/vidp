<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vidp social card</title>
    <style>
      /* Rendered to docs/social.png at 1200x630 by scripts/social.sh.
         Keep it self-contained: headless Chrome has no fonts beyond the system
         ones, so nothing here may depend on a webfont. */
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #12131a;
        color: #f2f3f5;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
          sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 84px;
        position: relative;
        overflow: hidden;
      }
      /* The same gradient the screenshots are shot over, so the card and the
         page read as one thing. */
      .glow {
        position: absolute;
        inset: -40% -10% auto -10%;
        height: 150%;
        background:
          radial-gradient(closest-side, #6b4fd8cc, #6b4fd800 70%),
          radial-gradient(closest-side, #2f8f6fbb, #2f8f6f00 70%);
        background-position: 30% 20%, 80% 70%;
        background-size: 70% 100%, 60% 100%;
        background-repeat: no-repeat;
        filter: blur(30px);
        opacity: 0.55;
      }
      .inner {
        position: relative;
      }
      .mark {
        width: 132px;
        height: 132px;
        border-radius: 30px;
        margin-bottom: 34px;
      }
      h1 {
        font-size: 82px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.04;
      }
      h1 em {
        font-style: normal;
        color: #8b93a1;
      }
      p {
        margin-top: 26px;
        font-size: 31px;
        color: #a8b0bd;
        line-height: 1.4;
        max-width: 22ch;
      }
      .cmd {
        margin-top: 38px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 25px;
        color: #d8dde5;
        background: #1d1f28;
        border: 1px solid #33363f;
        border-radius: 12px;
        padding: 17px 24px;
        width: fit-content;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="inner">
      <img class="mark" src="icon.png" alt="" />
      <h1>Vidp <em>plays the film.</em></h1>
      <p>A keyboard-driven video player built on libmpv.</p>
      <div class="cmd">brew install --cask vidp</div>
    </div>
  </body>
</html>
